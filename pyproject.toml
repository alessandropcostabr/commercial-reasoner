[project]
name = "commercial-reasoner"
version = "0.1.0"
description = "Engine de raciocinio comercial - agente conversacional de vendas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercial_reasoner"]

[tool.uv]
package = true
