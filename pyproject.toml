[project]
name = "commercial-reasoner"
version = "0.1.0"
description = "Engine de raciocinio comercial - agente conversacional de vendas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Camada de servico HTTP stateless para o LATE (contrato Fase 0). Opcional: a
# lib de reasoning/memory nao depende disto.
service = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercial_reasoner"]

[tool.uv]
package = true
